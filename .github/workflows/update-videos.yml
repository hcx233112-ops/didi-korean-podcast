name: Update Videos

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all videos via YouTube API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 << 'EOF'
          import json, urllib.request, urllib.parse, os

          API_KEY = os.environ["YOUTUBE_API_KEY"]

          PLAYLISTS = [
              "PLekI352WvEBMOwwGb0-XUsjW3f-IWhpy5",  # Korean Culture Podcast
              "PLekI352WvEBNkSjppsgn_t73uUsgSwNP3",  # Audio Book
              "PLekI352WvEBOfwVes4ydf5MVyYkmlcfzo",  # Global Guest Interview
              "PLekI352WvEBOzieG5X5SzFhL72eix2EGX",  # Live Stream
              "PLekI352WvEBPAgoMY2dl5_5Ml37M9nSLZ",  # Natural Korean Conversation
              "PLekI352WvEBPhAcLdV-4pvZOB3AzAE7T4",  # Korean News
          ]

          def fetch_playlist(pl_id):
              videos = []
              page_token = None
              while True:
                  params = {"part": "snippet", "playlistId": pl_id, "maxResults": 50, "key": API_KEY}
                  if page_token:
                      params["pageToken"] = page_token
                  url = "https://www.googleapis.com/youtube/v3/playlistItems?" + urllib.parse.urlencode(params)
                  with urllib.request.urlopen(url) as r:
                      data = json.load(r)
                  for item in data["items"]:
                      s = item["snippet"]
                      vid = s["resourceId"]["videoId"]
                      thumb = s["thumbnails"].get("medium", s["thumbnails"].get("default", {})).get("url", f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg")
                      videos.append({"id": vid, "title": s["title"], "published": s["publishedAt"][:10], "thumbnail": thumb})
                  page_token = data.get("nextPageToken")
                  if not page_token:
                      break
              return videos

          all_videos = {}
          for pl_id in PLAYLISTS:
              for v in fetch_playlist(pl_id):
                  if v["id"] not in all_videos and v["title"] not in ("Private video", "Deleted video"):
                      all_videos[v["id"]] = v

          videos_sorted = sorted(all_videos.values(), key=lambda v: v["published"], reverse=True)

          with open("data/videos.json", "r") as f:
              existing = json.load(f)

          old_count = len(existing["videos"])
          existing["videos"] = videos_sorted
          with open("data/videos.json", "w") as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)

          print(f"Total: {len(videos_sorted)} (was {old_count})")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: update videos $(date -u +%Y-%m-%d)"
            git push
          fi
