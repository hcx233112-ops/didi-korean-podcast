name: Update Videos

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all videos via YouTube API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 << 'EOF'
          import json, urllib.request, urllib.parse, os

          API_KEY = os.environ["YOUTUBE_API_KEY"]
          CHANNEL_ID = "UCjI0A18uEH8ivCRsbO9cI6w"

          url = f"https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id={CHANNEL_ID}&key={API_KEY}"
          with urllib.request.urlopen(url) as r:
              data = json.load(r)
          uploads_id = data["items"][0]["contentDetails"]["relatedPlaylists"]["uploads"]

          videos = []
          page_token = None
          while True:
              params = {"part": "snippet", "playlistId": uploads_id, "maxResults": 50, "key": API_KEY}
              if page_token:
                  params["pageToken"] = page_token
              url = "https://www.googleapis.com/youtube/v3/playlistItems?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url) as r:
                  data = json.load(r)
              for item in data["items"]:
                  s = item["snippet"]
                  vid = s["resourceId"]["videoId"]
                  thumb = s["thumbnails"].get("medium", s["thumbnails"].get("default", {})).get("url", f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg")
                  videos.append({"id": vid, "title": s["title"], "published": s["publishedAt"][:10], "thumbnail": thumb})
              page_token = data.get("nextPageToken")
              if not page_token:
                  break

          with open("data/videos.json", "r") as f:
              existing = json.load(f)

          existing_ids = {v["id"] for v in existing["videos"]}
          new_count = sum(1 for v in videos if v["id"] not in existing_ids)

          existing["videos"] = videos
          with open("data/videos.json", "w") as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)

          print(f"Total: {len(videos)}, New: {new_count}")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: update videos $(date -u +%Y-%m-%d)"
            git push
          fi
