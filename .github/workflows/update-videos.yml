name: Update Videos

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch videos for all channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 << 'EOF'
          import json, urllib.request, urllib.parse, os

          API_KEY = os.environ["YOUTUBE_API_KEY"]

          def fetch_playlist(pl_id):
              videos = []
              page_token = None
              while True:
                  params = {"part": "snippet", "playlistId": pl_id, "maxResults": 50, "key": API_KEY}
                  if page_token:
                      params["pageToken"] = page_token
                  url = "https://www.googleapis.com/youtube/v3/playlistItems?" + urllib.parse.urlencode(params)
                  with urllib.request.urlopen(url) as r:
                      data = json.load(r)
                  for item in data["items"]:
                      s = item["snippet"]
                      vid = s["resourceId"]["videoId"]
                      thumb = s["thumbnails"].get("medium", s["thumbnails"].get("default", {})).get("url", f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg")
                      videos.append({"id": vid, "title": s["title"], "published": s["publishedAt"][:10], "thumbnail": thumb})
                  page_token = data.get("nextPageToken")
                  if not page_token:
                      break
              return videos

          with open("data/channels.json") as f:
              channels = json.load(f)

          for ch in channels:
              ch_id = ch["id"]
              all_videos = {}
              for pl_id in ch["playlists"]:
                  for v in fetch_playlist(pl_id):
                      if v["id"] not in all_videos and v["title"] not in ("Private video", "Deleted video"):
                          all_videos[v["id"]] = v

              videos_sorted = sorted(all_videos.values(), key=lambda v: v["published"], reverse=True)

              out_path = f"public/data/videos/{ch_id}.json"
              try:
                  with open(out_path) as f:
                      existing = json.load(f)
                  old_count = len(existing.get("videos", []))
              except FileNotFoundError:
                  old_count = 0

              result = {"channelId": ch["channelId"], "channelName": ch["name"], "videos": videos_sorted}
              with open(out_path, "w") as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)

              print(f"{ch['name']}: {len(videos_sorted)} videos (was {old_count})")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: update videos $(date -u +%Y-%m-%d)"
            git push
          fi
