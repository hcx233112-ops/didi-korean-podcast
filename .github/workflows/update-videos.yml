name: Update Videos

on:
  schedule:
    - cron: '0 */4 * * *'  # 每 4 小时检查一次
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS and update videos.json
        run: |
          python3 << 'EOF'
          import json, urllib.request, xml.etree.ElementTree as ET

          CHANNEL_ID = "UCjI0A18uEH8ivCRsbO9cI6w"
          RSS_URL = f"https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL_ID}"

          with urllib.request.urlopen(RSS_URL) as r:
              tree = ET.parse(r)

          root = tree.getroot()
          ns = {
              'atom': 'http://www.w3.org/2005/Atom',
              'yt': 'http://www.youtube.com/xml/schemas/2015',
              'media': 'http://search.yahoo.com/mrss/',
          }

          videos = []
          for e in root.findall('atom:entry', ns):
              vid = e.find('yt:videoId', ns).text
              title = e.find('atom:title', ns).text
              published = e.find('atom:published', ns).text
              thumb = e.find('.//media:thumbnail', ns)
              thumb_url = thumb.get('url') if thumb is not None else f'https://i.ytimg.com/vi/{vid}/mqdefault.jpg'
              videos.append({'id': vid, 'title': title, 'published': published[:10], 'thumbnail': thumb_url})

          with open('data/videos.json', 'r') as f:
              existing = json.load(f)

          existing_ids = {v['id'] for v in existing['videos']}
          new_videos = [v for v in videos if v['id'] not in existing_ids]

          if new_videos:
              existing['videos'] = videos + [v for v in existing['videos'] if v['id'] not in {x['id'] for x in videos}]
              with open('data/videos.json', 'w') as f:
                  json.dump(existing, f, ensure_ascii=False, indent=2)
              print(f"Added {len(new_videos)} new video(s)")
          else:
              print("No new videos")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: update videos $(date -u +%Y-%m-%d)"
            git push
          fi
