name: Generate Transcripts

on:
  workflow_dispatch:          # 手动触发
  # Daily production runs on the Windows host; CI is a manual fallback only.

permissions:
  contents: write

concurrency:
  group: podcast-data-writes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300      # 最多跑 5 小时

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements-automation.txt

      - name: Generate missing transcripts
        run: python3 -u scripts/generate-transcripts-ci.py

      - name: Complete translations
        run: python3 -u scripts/retranslate.py

      - name: Commit new transcripts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/transcripts/
          if git diff --staged --quiet; then
            echo "没有新字幕"
          else
            COUNT=$(git diff --staged --name-only | wc -l)
            git commit -m "chore: add ${COUNT} transcript files"
            git pull --rebase origin main
            git push
          fi
