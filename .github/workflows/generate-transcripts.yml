name: Generate Transcripts

on:
  workflow_dispatch:          # 手动触发
  schedule:
    - cron: '0 2 * * *'      # 每天凌晨 2 点自动跑（补齐新视频的字幕）

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300      # 最多跑 5 小时

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install youtube-transcript-api deep-translator

      - name: Generate missing transcripts
        run: python3 -u scripts/generate-transcripts-ci.py

      - name: Commit new transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/transcripts/
          if git diff --staged --quiet; then
            echo "没有新字幕"
          else
            COUNT=$(git diff --staged --name-only | wc -l)
            git commit -m "chore: add ${COUNT} transcript files"
            git push
          fi
